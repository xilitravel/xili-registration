<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="0.15" y2="1">
    <stop offset="0" stop-color="#f7e7c7"/>
    <stop offset=".38" stop-color="#d6ad70"/>
    <stop offset=".72" stop-color="#b98545"/>
    <stop offset="1" stop-color="#f1d8aa"/>
