<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>囍莉旅遊｜旅遊報名</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
            background: #fff4f8;
            color: #5b3b46;
        }

        header {
            padding: 30px 20px;
            text-align: center;
            background: linear-gradient(135deg, #ffd6e5, #f8a8c7);
        }

        .logo {
            font-size: 36px;
            font-weight: bold;
            color: white;
            letter-spacing: 8px;
        }

        .subtitle {
            margin-top: 10px;
            font-size: 18px;
            color: #fff;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(200, 100, 140, 0.12);
        }

        h1 {
            font-size: 30px;
            color: #c94f83;
        }

        h2 {
            font-size: 24px;
            color: #c94f83;
        }

        p {
            font-size: 18px;
            line-height: 1.8;
        }

        .button {
            display: block;
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 15px;
            background: #e878a5;
            color: white;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            margin-top: 20px;
        }

        .button:hover {
            background: #d85c8d;
        }

        .notice {
            background: #fff0f5;
            border-left: 6px solid #e878a5;
            padding: 18px;
            border-radius: 10px;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            color: #b46d89;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">囍莉旅遊</div>
        <div class="subtitle">✈️ 跟著阿冷四處玩吧！！</div>
    </header>

    <main class="container">

        <section class="card">
            <h1>🌸 歡迎來到囍莉旅遊</h1>

            <p>
                一起把平凡的日子，
                變成值得收藏的旅行回憶！
            </p>

            <p>
                台南出發｜遊覽車旅行｜輕鬆慢遊｜溫暖同行
            </p>
        </section>

        <section class="card">
            <h2>📢 報名須知</h2>

            <div class="notice">
                <p>
                    請在報名前仔細閱讀行程內容、
                    費用及相關注意事項。
                </p>

                <p>
                    填寫完成後，請確認所有資料正確，
                    再送出報名。
                </p>
            </div>
        </section>

        <section class="card">
            <h2>📍 行程報名</h2>

            <p>
                點擊下方按鈕開始填寫旅遊報名資料。
            </p>

            <button class="button">
                🌸 開始報名
            </button>
        </section>

    </main>

    <footer>
        🌸 囍莉旅遊｜台南出發的小旅行 🌸
    </footer>

</body>
</html>
